{% extends "base.html" %}
{% block title %}Transfer Detail{% endblock %}
{% block content %}
<div class="mb-4">
  <a href="/transfers" class="text-teal-600 hover:underline text-sm">← Back to Transfers</a>
</div>

<div id="alert" class="hidden mb-4 px-4 py-3 rounded border text-sm"></div>

<div id="content">
  <p class="text-gray-400">Loading…</p>
</div>
{% endblock %}

{% block scripts %}
<script>
  const TRANSFER_ID = {{ transfer_id }};

  async function load() {
    try {
      const t = await apiFetch(`/api/transfers/${TRANSFER_ID}`);
      render(t);
    } catch (e) {
      showAlert(e.message);
    }
  }

  function render(t) {
    document.getElementById("content").innerHTML = `
      <div class="bg-white rounded-lg shadow p-6 space-y-6">
        <!-- Header -->
        <div class="flex justify-between items-start">
          <div>
            <h1 class="text-2xl font-bold text-gray-800 font-mono">${t.reference}</h1>
            <p class="text-gray-500 mt-1 text-sm">Created: ${new Date(t.created_at).toLocaleString()}</p>
            ${t.validated_at ? `<p class="text-gray-400 text-sm">Validated: ${new Date(t.validated_at).toLocaleString()}</p>` : ""}
            ${t.notes ? `<p class="text-gray-400 text-sm mt-1">${t.notes}</p>` : ""}
          </div>
          <div class="text-right">
            ${statusBadge(t.status)}
            ${t.status === "DRAFT" ? `
              <div class="mt-3">
                <button onclick="validate()"
                  class="bg-teal-600 text-white px-4 py-2 rounded hover:bg-teal-700 text-sm font-semibold">
                  ✓ Validate Transfer
                </button>
              </div>` : `<p class="mt-2 text-green-600 text-sm font-semibold">✓ Stock moved atomically</p>`}
          </div>
        </div>

        <!-- Transfer details -->
        <div class="grid grid-cols-3 gap-6 border-t pt-6">
          <div class="text-center">
            <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">Source Location</p>
            <p class="font-semibold text-gray-800">${t.source_location_name || "ID: " + t.source_location_id}</p>
          </div>
          <div class="text-center">
            <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">Product</p>
            <p class="font-semibold text-gray-800">${t.product_name || "ID: " + t.product_id}</p>
            <p class="text-2xl font-bold text-teal-600 mt-1">${t.quantity}</p>
            <p class="text-xs text-gray-400">units</p>
          </div>
          <div class="text-center">
            <p class="text-xs text-gray-500 uppercase tracking-wide mb-1">Destination Location</p>
            <p class="font-semibold text-gray-800">${t.destination_location_name || "ID: " + t.destination_location_id}</p>
          </div>
        </div>

        <!-- Visual arrow -->
        <div class="flex items-center justify-center gap-4 py-2 text-gray-400">
          <span class="px-3 py-1 bg-gray-100 rounded font-semibold text-gray-700">${t.source_location_name || "Source"}</span>
          <span class="text-2xl">→</span>
          <span class="px-3 py-1 bg-gray-100 rounded font-semibold text-gray-700">${t.destination_location_name || "Destination"}</span>
        </div>

        ${t.status === "VALIDATED" ? `
        <div class="bg-green-50 border border-green-200 rounded p-4 text-green-700 text-sm">
          ✓ Transfer validated. Source stock decreased by ${t.quantity}, destination stock increased by ${t.quantity}.
          Total company stock is unchanged.
        </div>` : ""}
      </div>
    `;
  }

  async function validate() {
    if (!confirm("Validate this transfer? Stock will be moved atomically between locations.")) return;
    try {
      const res = await apiFetch(`/api/transfers/${TRANSFER_ID}/validate`, { method: "POST" });
      render(res.transfer);
      showAlert(
        `${res.message} Source: ${res.source_stock_after} | Destination: ${res.destination_stock_after}`,
        "success"
      );
    } catch (e) {
      showAlert(e.message);
    }
  }

  load();
</script>
{% endblock %}
