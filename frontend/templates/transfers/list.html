{% extends "base.html" %}
{% block title %}Internal Transfers{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold text-gray-800">Internal Transfers</h1>
  <a href="/transfers/create"
     class="bg-teal-600 text-white px-4 py-2 rounded-lg hover:bg-teal-700 font-semibold">
    + New Transfer
  </a>
</div>

<div id="alert" class="hidden mb-4 px-4 py-3 rounded border text-sm"></div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 border-b text-gray-600 uppercase text-xs">
      <tr>
        <th class="px-4 py-3 text-left">Reference</th>
        <th class="px-4 py-3 text-left">Product</th>
        <th class="px-4 py-3 text-left">From</th>
        <th class="px-4 py-3 text-left">To</th>
        <th class="px-4 py-3 text-right">Qty</th>
        <th class="px-4 py-3 text-left">Status</th>
        <th class="px-4 py-3 text-left">Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody" class="divide-y divide-gray-100">
      <tr><td colspan="7" class="px-4 py-6 text-center text-gray-400">Loading…</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function load() {
    try {
      const transfers = await apiFetch("/api/transfers");
      const body = document.getElementById("tableBody");
      if (!transfers.length) {
        body.innerHTML = `<tr><td colspan="7" class="px-4 py-6 text-center text-gray-400">No transfers found.</td></tr>`;
        return;
      }
      body.innerHTML = transfers.map(t => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 font-mono font-semibold">${t.reference}</td>
          <td class="px-4 py-3">${t.product_name || t.product_id}</td>
          <td class="px-4 py-3 text-gray-600">${t.source_location_name || t.source_location_id}</td>
          <td class="px-4 py-3 text-gray-600">${t.destination_location_name || t.destination_location_id}</td>
          <td class="px-4 py-3 text-right font-semibold">${t.quantity}</td>
          <td class="px-4 py-3">${statusBadge(t.status)}</td>
          <td class="px-4 py-3">
            <a href="/transfers/${t.id}" class="text-teal-600 hover:underline">View</a>
          </td>
        </tr>
      `).join("");
    } catch (e) {
      showAlert(e.message);
    }
  }

  load();
</script>
{% endblock %}
