{% extends "base.html" %}
{% block title %}Delivery Detail{% endblock %}
{% block content %}
<div class="mb-4">
  <a href="/deliveries" class="text-indigo-600 hover:underline text-sm">← Back to Deliveries</a>
</div>

<div id="alert" class="hidden mb-4 px-4 py-3 rounded border text-sm"></div>

<div id="content" class="space-y-6">
  <p class="text-gray-400">Loading…</p>
</div>
{% endblock %}

{% block scripts %}
<script>
  const DELIVERY_ID = {{ delivery_id }};
  const STATUSES = ["DRAFT", "PICKED", "PACKED", "VALIDATED"];

  async function load() {
    try {
      const d = await apiFetch(`/api/deliveries/${DELIVERY_ID}`);
      render(d);
    } catch (e) {
      showAlert(e.message);
    }
  }

  function render(d) {
    const nextIdx = STATUSES.indexOf(d.status) + 1;
    const canAdvance = d.status !== "VALIDATED" && nextIdx < STATUSES.length - 1;
    const canValidate = d.status === "PACKED";

    document.getElementById("content").innerHTML = `
      <!-- Header -->
      <div class="bg-white rounded-lg shadow p-6 flex justify-between items-start">
        <div>
          <h1 class="text-2xl font-bold text-gray-800 font-mono">${d.reference}</h1>
          <p class="text-gray-500 mt-1">Customer: ${d.customer_name || "—"}</p>
          ${d.notes ? `<p class="text-gray-400 text-sm mt-1">${d.notes}</p>` : ""}
          <p class="text-gray-400 text-xs mt-2">Created: ${new Date(d.created_at).toLocaleString()}</p>
          ${d.validated_at ? `<p class="text-gray-400 text-xs">Validated: ${new Date(d.validated_at).toLocaleString()}</p>` : ""}
        </div>
        <div class="text-right space-y-2">
          ${statusBadge(d.status)}
          <div class="flex gap-2 mt-3">
            ${canAdvance ? `
              <button onclick="advanceStatus()"
                class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600 text-sm font-semibold">
                → Mark as ${STATUSES[nextIdx]}
              </button>` : ""}
            ${canValidate ? `
              <button onclick="validate()"
                class="bg-green-600 text-white px-4 py-2 rounded hover:bg-green-700 text-sm font-semibold">
                ✓ Validate & Ship
              </button>` : ""}
            ${d.status === "VALIDATED" ? `<p class="text-green-600 text-sm font-semibold">✓ Validated – Stock decremented</p>` : ""}
          </div>
        </div>
      </div>

      <!-- Status Timeline -->
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="font-semibold text-gray-700 mb-4">Status Workflow</h2>
        <div class="flex items-center gap-2">
          ${STATUSES.map((s, i) => {
            const passed = STATUSES.indexOf(d.status) >= i;
            return `
              <div class="flex items-center gap-2">
                <div class="rounded-full px-3 py-1 text-xs font-semibold ${passed ? "bg-indigo-600 text-white" : "bg-gray-200 text-gray-500"}">
                  ${s}
                </div>
                ${i < STATUSES.length - 1 ? `<div class="w-8 h-0.5 ${passed ? "bg-indigo-400" : "bg-gray-200"}"></div>` : ""}
              </div>`;
          }).join("")}
        </div>
      </div>

      <!-- Product Lines -->
      <div class="bg-white rounded-lg shadow p-6">
        <h2 class="font-semibold text-gray-700 mb-4">Product Lines</h2>
        <table class="w-full text-sm">
          <thead class="text-gray-500 border-b text-xs uppercase">
            <tr>
              <th class="pb-2 text-left">Product</th>
              <th class="pb-2 text-left">SKU</th>
              <th class="pb-2 text-right">Quantity</th>
            </tr>
          </thead>
          <tbody class="divide-y">
            ${(d.lines || []).map(l => `
              <tr>
                <td class="py-2">${l.product_name}</td>
                <td class="py-2 font-mono text-gray-500">${l.product_sku}</td>
                <td class="py-2 text-right font-semibold">${l.quantity}</td>
              </tr>
            `).join("") || `<tr><td colspan="3" class="py-4 text-center text-gray-400">No lines.</td></tr>`}
          </tbody>
        </table>
      </div>
    `;
  }

  async function advanceStatus() {
    try {
      const d = await apiFetch(`/api/deliveries/${DELIVERY_ID}/status`, { method: "PATCH" });
      render(d);
      showAlert(`Status updated to ${d.status}`, "success");
    } catch (e) {
      showAlert(e.message);
    }
  }

  async function validate() {
    if (!confirm("Validate this delivery? Stock will be permanently decremented.")) return;
    try {
      const res = await apiFetch(`/api/deliveries/${DELIVERY_ID}/validate`, { method: "POST" });
      render(res.delivery);
      showAlert(res.message, "success");
    } catch (e) {
      showAlert(e.message);
    }
  }

  load();
</script>
{% endblock %}
