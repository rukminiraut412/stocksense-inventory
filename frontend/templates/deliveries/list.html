{% extends "base.html" %}
{% block title %}Delivery Orders{% endblock %}
{% block content %}
<div class="flex justify-between items-center mb-6">
  <h1 class="text-2xl font-bold text-gray-800">Delivery Orders</h1>
  <a href="/deliveries/create"
     class="bg-indigo-600 text-white px-4 py-2 rounded-lg hover:bg-indigo-700 font-semibold">
    + New Delivery
  </a>
</div>

<div id="alert" class="hidden mb-4 px-4 py-3 rounded border text-sm"></div>

<!-- Filter -->
<div class="mb-4 flex gap-3">
  <select id="statusFilter" onchange="load()"
          class="border rounded px-3 py-2 text-sm">
    <option value="">All Statuses</option>
    <option>DRAFT</option>
    <option>PICKED</option>
    <option>PACKED</option>
    <option>VALIDATED</option>
  </select>
</div>

<div class="bg-white rounded-lg shadow overflow-hidden">
  <table class="w-full text-sm">
    <thead class="bg-gray-50 border-b text-gray-600 uppercase text-xs">
      <tr>
        <th class="px-4 py-3 text-left">Reference</th>
        <th class="px-4 py-3 text-left">Customer</th>
        <th class="px-4 py-3 text-left">Status</th>
        <th class="px-4 py-3 text-left">Created</th>
        <th class="px-4 py-3 text-left">Actions</th>
      </tr>
    </thead>
    <tbody id="tableBody" class="divide-y divide-gray-100">
      <tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">Loading…</td></tr>
    </tbody>
  </table>
</div>
{% endblock %}

{% block scripts %}
<script>
  async function load() {
    const filter = document.getElementById("statusFilter").value;
    try {
      const deliveries = await apiFetch("/api/deliveries");
      const filtered = filter ? deliveries.filter(d => d.status === filter) : deliveries;
      const body = document.getElementById("tableBody");
      if (!filtered.length) {
        body.innerHTML = `<tr><td colspan="5" class="px-4 py-6 text-center text-gray-400">No deliveries found.</td></tr>`;
        return;
      }
      body.innerHTML = filtered.map(d => `
        <tr class="hover:bg-gray-50">
          <td class="px-4 py-3 font-mono font-semibold">${d.reference}</td>
          <td class="px-4 py-3">${d.customer_name || "—"}</td>
          <td class="px-4 py-3">${statusBadge(d.status)}</td>
          <td class="px-4 py-3 text-gray-500">${new Date(d.created_at).toLocaleString()}</td>
          <td class="px-4 py-3">
            <a href="/deliveries/${d.id}" class="text-indigo-600 hover:underline">View</a>
          </td>
        </tr>
      `).join("");
    } catch (e) {
      showAlert(e.message);
    }
  }

  load();
</script>
{% endblock %}
