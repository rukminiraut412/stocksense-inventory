{% extends "base.html" %}
{% block title %}Create Delivery{% endblock %}
{% block content %}
<div class="max-w-xl mx-auto">
  <h1 class="text-2xl font-bold text-gray-800 mb-6">New Delivery Order</h1>
  <div id="alert" class="hidden mb-4 px-4 py-3 rounded border text-sm"></div>

  <form id="deliveryForm" class="bg-white rounded-lg shadow p-6 space-y-5">
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Customer Name</label>
      <input id="customerName" type="text" placeholder="Optional"
             class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Notes</label>
      <textarea id="notes" rows="2" placeholder="Optional"
                class="w-full border rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"></textarea>
    </div>

    <div>
      <label class="block text-sm font-medium text-gray-700 mb-2">Product Lines</label>
      <div id="linesContainer" class="space-y-3"></div>
      <button type="button" onclick="addLine()"
              class="mt-3 text-indigo-600 text-sm hover:underline">+ Add Product Line</button>
    </div>

    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="bg-indigo-600 text-white px-5 py-2 rounded-lg hover:bg-indigo-700 font-semibold text-sm">
        Create Delivery
      </button>
      <a href="/deliveries" class="text-gray-500 text-sm self-center hover:underline">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}

{% block scripts %}
<script>
  let products = [];
  let lineIndex = 0;

  async function init() {
    try {
      products = await apiFetch("/api/products");
      addLine();
    } catch (e) {
      showAlert(e.message);
    }
  }

  function productOptions() {
    return products.map(p =>
      `<option value="${p.id}">${p.name} (SKU: ${p.sku}) – Stock: ${p.current_stock}</option>`
    ).join("");
  }

  function addLine() {
    const idx = lineIndex++;
    const div = document.createElement("div");
    div.id = `line-${idx}`;
    div.className = "flex gap-2 items-center";
    div.innerHTML = `
      <select class="flex-1 border rounded px-2 py-2 text-sm" data-field="product_id">
        <option value="">Select product…</option>
        ${productOptions()}
      </select>
      <input type="number" min="0.01" step="0.01" placeholder="Qty"
             class="w-24 border rounded px-2 py-2 text-sm" data-field="quantity" />
      <button type="button" onclick="removeLine(${idx})"
              class="text-red-400 hover:text-red-600 text-lg">✕</button>
    `;
    document.getElementById("linesContainer").appendChild(div);
  }

  function removeLine(idx) {
    document.getElementById(`line-${idx}`)?.remove();
  }

  document.getElementById("deliveryForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const lineDivs = document.querySelectorAll("#linesContainer > div");
    const lines = [];
    for (const div of lineDivs) {
      const product_id = div.querySelector("[data-field='product_id']").value;
      const quantity = div.querySelector("[data-field='quantity']").value;
      if (!product_id || !quantity) {
        showAlert("Please fill in all product line fields.");
        return;
      }
      lines.push({ product_id: parseInt(product_id), quantity: parseFloat(quantity) });
    }
    if (!lines.length) {
      showAlert("Add at least one product line.");
      return;
    }
    try {
      const delivery = await apiFetch("/api/deliveries", {
        method: "POST",
        body: JSON.stringify({
          customer_name: document.getElementById("customerName").value,
          notes: document.getElementById("notes").value,
          lines,
        }),
      });
      window.location.href = `/deliveries/${delivery.id}`;
    } catch (e) {
      showAlert(e.message);
    }
  });

  init();
</script>
{% endblock %}
